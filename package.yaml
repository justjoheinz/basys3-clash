# The reusable half: wire protocols, peripherals, one Pmod, this board's facts, and
# the two modules that sit outside those namespaces on purpose (Ascii, Serial).
# Nothing in here knows which design is being built, and now nothing in here *can*
# import one -- the designs live in a package that depends on this one, so the
# boundary is a dependency edge rather than a promise. See examples/package.yaml.
#
# This file is the source of truth and basys3.cabal is generated from it by hpack,
# which Stack runs on every build. No module lists appear below: hpack finds them by
# walking source-dirs, so adding a peripheral is a new file and nothing else.
#
# The name is the board, because that is what the package is about. It was `blinky`
# for as long as the blinking was the point; the demo that gave it that name is now
# one file in examples/src/ and not even the interesting one.
name:      basys3
version:   0.1.0.0
synopsis:  Clash building blocks for the Digilent Basys3 (Artix-7 xc7a35t)

dependencies:
  - base                    >=4.18 && <5
  - clash-prelude           >=1.10 && <1.12
  - ghc-typelits-extra        >=0.5
  - ghc-typelits-knownnat     >=0.8
  - ghc-typelits-natnormalise >=0.9
  # For Ascii.ascii, which turns a string literal into a Vec at compile time.
  - template-haskell

library:
  <<: !include "clash-common.yaml"
  source-dirs: src

# The library's own suite, so that `stack test basys3` says whether the library
# works without a single design in scope -- which is the question somebody who has
# just bumped the snapshot is asking. The designs have their own suite next door
# (examples/test/), and it checks a different thing: that they wire these parts up
# the way their documentation says.
#
# spec/ rather than test/, which is taken: test/ holds the HDL fixtures that
# Verilator and Icarus read, and those are not GHC's business.
tests:
  spec:
    <<: !include "clash-common.yaml"
    main: Spec.hs
    source-dirs: spec
    dependencies:
      - basys3
